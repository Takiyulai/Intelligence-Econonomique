<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Intelligence économique pour les exportateurs de fruits et légumes d'Afrique de l'Ouest vers l'Europe : prix, volumes, normes." />
    <meta name="theme-color" content="#0b1410" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f8f5" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Agro Corridor Intelligence</title>
    <script>
      // Applique le thème avant le rendu pour éviter le flash.
      try {
        const t = localStorage.getItem('theme')
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
